name: Release

# Push a version tag (for example v0.1.0) to build the Windows installer and
# publish it as a GitHub Release. Installed copies of Prism pick it up
# automatically through the built-in updater.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # When started by hand, tag the commit with the version from package.json
      # so the release has a tag to attach to.
      - name: Tag this version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            git tag "$v"
            git push origin "$v"
          fi

      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
