name: Release

# Push a version tag (for example v0.1.0) to build the Windows installer and
# publish it as a GitHub Release. Installed copies of Prism pick it up
# automatically through the built-in updater.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # When started by hand, tag the commit with the version from package.json
      # so the release has a tag to attach to.
      - name: Tag this version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            git tag "$v"
            git push origin "$v"
          fi

      # Create the release up front, so electron-builder's parallel uploads
      # all land in this one release instead of each making its own.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --title "Prism $v" --generate-notes

      # Build first, then upload. GitHub sometimes times out (504) on a
      # download or upload, so each part is retried a few times.
      - name: Build
        shell: bash
        run: |
          for i in 1 2 3; do npx electron-builder --win --publish never && exit 0; echo "Build failed, retrying in 30s"; sleep 30; done; exit 1

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          for i in 1 2 3 4; do gh release upload "$v" dist/*.exe dist/*.blockmap dist/latest.yml --clobber && exit 0; echo "Upload failed, retrying in 30s"; sleep 30; done; exit 1

      - name: Remove duplicate releases
        if: always()
        run: node scripts/dedupe-releases.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
