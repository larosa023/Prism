<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src https: wss:; media-src https: blob:; worker-src blob:;">
  <title>Prism mini player</title>
  <style>
    :root { --accent: #9b6bff; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #ece9f3;
      font: 12px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
    #media { position: absolute; inset: 0; }
    #media video, #media webview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .bar { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px;
      padding: 6px 8px; background: linear-gradient(rgba(0,0,0,.75), transparent); opacity: 0; transition: opacity .15s;
      -webkit-app-region: drag; }
    body:hover .bar { opacity: 1; }
    .bar > * { -webkit-app-region: no-drag; }
    .name { font-weight: 600; -webkit-app-region: drag; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button { height: 24px; min-width: 24px; padding: 0 7px; border: 0; border-radius: 6px; background: rgba(0,0,0,.6);
      color: inherit; cursor: pointer; font: inherit; }
    button:hover { background: rgba(155,107,255,.85); }
    input[type=range] { width: 70px; accent-color: var(--accent); }
    .status { position: absolute; left: 8px; bottom: 8px; z-index: 2; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.7); }
    /* Dragging anywhere on the video moves the window (the controls stay clickable). */
    .grip { position: absolute; inset: 34px 0 0; z-index: 1; -webkit-app-region: drag; }
  </style>
</head>
<body>
  <div id="media"></div>
  <div class="grip" id="grip"></div>
  <div class="bar">
    <span class="name" id="name"></span>
    <input id="vol" type="range" min="0" max="1" step="0.05" title="Volume">
    <button id="mute" title="Sound">🔊</button>
    <button id="back" title="Back to multi-view">⇱</button>
    <button id="close" title="Close">✕</button>
  </div>
  <div class="status" id="status" hidden></div>
  <script src="../../node_modules/hls.js/dist/hls.light.min.js"></script>
  <script src="native-player.js"></script>
  <script src="mini.js"></script>
</body>
</html>
